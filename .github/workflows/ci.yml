name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Ruff
        run: python -m ruff check dane_meteo_stacje

      - name: Mypy
        run: python -m mypy

      - name: Pytest with coverage
        run: python -m pytest --cov=dane_meteo_stacje --cov-report=term-missing --cov-fail-under=85

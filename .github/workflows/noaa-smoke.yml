name: NOAA Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: noaa-smoke
  cancel-in-progress: false

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOAA_API_TOKENS: ${{ secrets.NOAA_API_TOKENS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install .

      - name: Verify secret presence
        shell: bash
        run: |
          if [ -z "${NOAA_API_TOKENS:-}" ]; then
            echo "::error::Missing NOAA_API_TOKENS secret in repository settings."
            exit 1
          fi

      - name: Fetch one NOAA station
        shell: bash
        run: |
          python - <<'PY'
          from dane_meteo_stacje.data import fetch_stations_with_cache_details

          result = fetch_stations_with_cache_details(
              remote_url=(
                  "https://www.ncei.noaa.gov/cdo-web/api/v2/stations"
                  "?locationid=FIPS:PL&limit=1"
              ),
              refresh=True,
          )
          if result.source != "remote" or not result.stations:
              raise SystemExit("::error::NOAA smoke did not return a remote station.")

          print(f"NOAA smoke passed: source={result.source}, stations={len(result.stations)}")
          PY

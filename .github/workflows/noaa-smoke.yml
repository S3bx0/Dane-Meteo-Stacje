name: NOAA Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: noaa-smoke
  cancel-in-progress: false

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOAA_API_TOKENS: ${{ secrets.NOAA_API_TOKENS }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install .

      - name: Verify secret presence
        shell: bash
        run: |
          if [ -z "${NOAA_API_TOKENS:-}" ]; then
            echo "::error::Missing NOAA_API_TOKENS secret in repository settings."
            exit 1
          fi

      - name: Verify country search and Heatmap JSON
        shell: bash
        run: |
          python - <<'PY'
          from dane_meteo_stacje.data import (
              fetch_monthly_temperature_matrix,
              fetch_stations_for_country,
          )

          result = fetch_stations_for_country("Poland", timeout=30)
          if result.source != "noaa-country" or not result.stations:
              raise SystemExit("::error::NOAA country search did not return stations.")

          heatmap = fetch_monthly_temperature_matrix(
              "PLM00012295",
              2020,
              2020,
              timeout=30,
              concurrency=1,
              max_attempts=1,
          )
          if heatmap["years"] != [2020] or len(heatmap["temperatures"][0]) != 12:
              raise SystemExit("::error::NOAA Heatmap export has an invalid shape.")

          print(
              "NOAA smoke passed: "
              f"source={result.source}, stations={len(result.stations)}, "
              f"temperature_years={heatmap['years']}"
          )
          PY

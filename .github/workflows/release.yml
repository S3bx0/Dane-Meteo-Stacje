name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Run tests
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'from dane_meteo_stacje import __version__; print(__version__)')"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/dane-meteo-stacje-release
          /tmp/dane-meteo-stacje-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/dane-meteo-stacje-release/bin/dane-meteo-stacje --help
          /tmp/dane-meteo-stacje-release/bin/dane-meteo-stacje-gui --help
          /tmp/dane-meteo-stacje-release/bin/python -c \
            "from dane_meteo_stacje import __version__; assert __version__ == '${GITHUB_REF_NAME#v}'"

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [compatibility, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: release-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Dane Meteo Stacje ${GITHUB_REF_NAME}"
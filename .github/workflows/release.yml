name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install . hypothesis openapi-spec-validator pytest

      - name: Run tests
        run: python -m pytest -m "not e2e"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'from dane_meteo_stacje import __version__; print(__version__)')"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade build twine "cyclonedx-bom==7.3.1"

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/dane-meteo-stacje-release
          /tmp/dane-meteo-stacje-release/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/dane-meteo-stacje-release/bin/dane-meteo-stacje --help
          /tmp/dane-meteo-stacje-release/bin/dane-meteo-stacje-gui --help
          /tmp/dane-meteo-stacje-release/bin/python -c \
            "from dane_meteo_stacje import __version__; assert __version__ == '${GITHUB_REF_NAME#v}'"

      - name: Generate SBOM and checksums
        shell: bash
        run: |
          cyclonedx-py environment /tmp/dane-meteo-stacje-release/bin/python \
            --pyproject pyproject.toml \
            --mc-type application \
            --output-reproducible \
            --of JSON \
            -o "dist/dane-meteo-stacje-${GITHUB_REF_NAME#v}.cdx.json"
          cd dist
          sha256sum ./*.whl ./*.tar.gz ./*.cdx.json > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "dist/*"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [compatibility, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Dane Meteo Stacje ${GITHUB_REF_NAME}"
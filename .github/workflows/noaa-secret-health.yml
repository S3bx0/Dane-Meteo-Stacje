name: NOAA Secret Health

on:
  workflow_dispatch:

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    env:
      NOAA_API_TOKENS: ${{ secrets.NOAA_API_TOKENS }}

    steps:
      - name: Check NOAA_API_TOKENS presence
        shell: bash
        run: |
          if [ -z "${NOAA_API_TOKENS:-}" ]; then
            echo "::error::Missing NOAA_API_TOKENS secret in repository settings."
            exit 1
          fi

      - name: Parse token count safely
        run: |
          python - <<'PY'
          import os

          tokens = [t.strip() for t in os.getenv("NOAA_API_TOKENS", "").split(",") if t.strip()]
          if not tokens:
              raise SystemExit("::error::NOAA_API_TOKENS is set but empty after CSV parsing.")

          print(f"NOAA token count detected: {len(tokens)}")
          PY

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dane-meteo-stacje"
dynamic = ["version"]
description = "Narzędzie do wyszukiwania i opisu stacji meteorologicznych NOAA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sebastian"}]
license = "MIT"
dependencies = [
	"requests>=2.31.0",
	"typing-extensions>=4.4.0",
]

[project.optional-dependencies]
dev = [
	"bandit>=1.8.0",
	"build>=1.2.2",
	"hypothesis>=6.0.0",
	"pip-audit>=2.9.0",
	"pytest>=8.0.0",
	"pytest-cov>=5.0.0",
	"ruff>=0.6.0",
	"mypy>=1.11.0",
	"twine>=5.1.1",
	"types-requests>=2.32.0.20240712",
]
e2e = [
	"playwright>=1.55.0",
	"pytest>=8.0.0",
	"pytest-playwright>=0.7.0",
]

[project.scripts]
dane-meteo-stacje = "dane_meteo_stacje.cli:main"
dane-meteo-stacje-gui = "dane_meteo_stacje.gui_bootstrap:main"

[tool.setuptools.dynamic]
version = {attr = "dane_meteo_stacje.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: browser-based end-to-end tests requiring Playwright Chromium"]

[tool.coverage.run]
source = ["dane_meteo_stacje"]
parallel = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["verify_ID.py", "test_verify_ID.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["dane_meteo_stacje"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true

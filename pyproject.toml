[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dane-meteo-stacje"
version = "0.1.0"
description = "Narzędzie do wyszukiwania i opisu stacji meteorologicznych NOAA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sebastian"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
dane-meteo-stacje = "dane_meteo_stacje.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

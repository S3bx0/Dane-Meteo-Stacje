[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dane-meteo-stacje"
version = "0.1.0"
description = "Narzędzie do wyszukiwania i opisu stacji meteorologicznych NOAA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sebastian"}]
license = {text = "MIT"}
dependencies = [
	"requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0.0",
	"pytest-cov>=5.0.0",
	"ruff>=0.6.0",
	"mypy>=1.11.0",
	"types-requests>=2.32.0.20240712",
]

[project.scripts]
dane-meteo-stacje = "dane_meteo_stacje.cli:main"
dane-meteo-stacje-gui = "dane_meteo_stacje.gui_bootstrap:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["dane_meteo_stacje"]
parallel = true
omit = ["dane_meteo_stacje/gui_bootstrap.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["dane_meteo_stacje"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
